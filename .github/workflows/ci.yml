name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (tests, lint, debug build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --build-cache --no-daemon

      - name: Lint app and SDK module
        run: |
          ./gradlew lint :llama-bro-sdk:lint --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify debug APK contents
        run: bash scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ai-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  benchmark:
    name: Benchmark scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile benchmark scripts
        run: |
          python3 -m py_compile scripts/prompt-benchmark/benchmark.py
          python3 -m py_compile scripts/prompt-benchmark/tool_benchmark.py
          python3 -m py_compile scripts/prompt-benchmark/inject_benchmark.py
          python3 -m py_compile scripts/prompt-benchmark/run_all.py

      - name: Capabilities JSON in sync
        run: |
          python3 -c "import json; json.load(open('scripts/prompt-benchmark/capabilities.json')); json.load(open('app/src/main/assets/capabilities.json'))"
          diff -q scripts/prompt-benchmark/capabilities.json app/src/main/assets/capabilities.json
