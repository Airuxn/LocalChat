name: Bug report
description: Something is broken in Pocket AI / Airux Pocket AI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Include device info and steps — diagnostic export from the app (Chat error → Details) helps a lot.

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.0.0 (1)
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device & Android version
      placeholder: e.g. Samsung SM-S938B, Android 16
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Active LLM model
      placeholder: e.g. Qwen3 1.7B
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open app
        2. Select model X
        3. Send message Y
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Diagnostic log (optional)
      description: Paste from in-app error dialog if available
      render: shell
